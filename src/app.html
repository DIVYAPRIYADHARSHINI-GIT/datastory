<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="DataStory - turn any spreadsheet into a story. Upload a CSV or Excel file and get KPI cards, charts and written insights in under a minute. Your data never leaves your device."
		/>
		<meta name="theme-color" content="#4F46E5" />
		<script>
			// Apply the saved theme before first paint so there is no light/dark flash.
			try {
				const raw = localStorage.getItem('datastory:settings:v1');
				const theme = raw ? JSON.parse(raw)?.theme : 'system';
				const dark =
					theme === 'dark' ||
					((theme === 'system' || !theme) &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			} catch (e) {
				// Storage blocked (private mode / embedded) - fall back to the light interface.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
